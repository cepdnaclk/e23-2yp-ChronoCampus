<!DOCTYPE html>
<html>

<head>

    <title>Staff Directory</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style4.css') }}">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/nav.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/components.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/reservations.css') }}">

</head>

<body>

    <div class="bg-layer"></div>
    <div class="grid-overlay"></div>
    <div class="page-wrap">


        <!-- ── Navbar ─────────────────────────────────────────────── -->
        <nav>
            <div class="nav-logo">
                <div class="logo-icon">🏛️</div>
                <div>
                    <div class="logo-text">Chrono<span>Campus</span></div>
                </div>
            </div>
            <ul class="nav-links">
                <li><a href="/room">Room Availability</a></li>
                <li><a href="/booking">Book a Room</a></li>
                <li><a href="/my_reservations" class="active">My Reservations</a></li>
                <li><a href="/directory">Users Details</a></li>
            </ul>
            <div class="nav-right">
                <button class="notif-bell" id="notifBell" title="Notifications">
                    🔔<span class="notif-dot" id="notifDot"></span>
                </button>
                <div class="nav-user">
                    <span id="navUserName">—</span>
                    <div class="avatar" id="navAvatar">—</div>
                    <button class="logout-btn" onclick="Auth.logout()">Logout</button>
                </div>
            </div>
        </nav>

        <h2>Staff Directory</h2>

        <div id="staffContainer"></div>

        <script>

            fetch("/api/staff")
                .then(res => res.json())
                .then(data => {

                    const container = document.getElementById("staffContainer");

                    data.forEach(s => {

                        container.innerHTML += `
        <div class="staff-card" onclick="openProfile(${s.id})">
            <img src="/images/${s.image}">
            <h3>${s.name}</h3>
            <p>${s.department}</p>
        </div>
        `

                    });

                });

            function openProfile(id) {
                window.location.href = "/staff/" + id
            }

        </script>

        <script src="{{ url_for('static', filename='js/auth.js') }}"></script>
        <script src="{{ url_for('static', filename='js/api.js') }}"></script>
        <script src="{{ url_for('static', filename='js/notifications.js') }}"></script>
        <script src="{{ url_for('static', filename='js/reservations.js') }}"></script>

</body>

</html>
