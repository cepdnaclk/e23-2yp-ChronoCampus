<!DOCTYPE html>
<html>

<head>
    <title>Search Room</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <header>
        Search Room
    </header>

    <div class="container">

        <div class="section">

            <input type="text" id="searchName" placeholder="Room name">

            <input type="date" id="searchDate">

            <button class="action" onclick="searchRoom()">
                Search
            </button>

            <div id="searchResult"></div>

            <button class="back" onclick="window.location.href='/room'">
                Back
            </button>

        </div>

    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>

</body>

</html>
