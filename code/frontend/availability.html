<!DOCTYPE html>
<html>

<head>
    <title>Room Availability</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        Room Availability Checker
    </header>

    <div class="container">

        <div class="section">

            <input type="number" id="roomId" placeholder="Room ID">

            <input type="date" id="availDate">

            <button class="action" onclick="checkAvailability()">
                Check Availability
            </button>

            <div id="availability"></div>

            <button class="back" onclick="window.location.href='index.html'">
                Back
            </button>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
