<!DOCTYPE html>
<html>

<head>
    <title>Admin Dashboard</title>

    <style>
    body {
        font-family: Arial, sans-serif;
        text-align: center;
        background: radial-gradient(circle at top, #0b1a2b, #050b14);
        color: white;
        margin-top: 100px;
    }

    h1 {
        font-size: 42px;
        margin-bottom: 30px;
    }

    button {
        padding: 15px 30px;
        margin: 20px;
        font-size: 18px;
        border: none;
        border-radius: 10px;
        background: linear-gradient(90deg, #00c6ff, #0072ff);
        color: white;
        cursor: pointer;
        transition: 0.3s;
    }

    button:hover {
        transform: scale(1.05);
        box-shadow: 0 0 15px rgba(0, 198, 255, 0.5);
    }
</style>

</head>

<body>

    <h1>Admin Dashboard</h1>

    <button onclick="location.href='/directory'">
        User Details
    </button>

    <button onclick="location.href='/admin'">
        Add / Delete Details
    </button>
    

</body>

</html>
