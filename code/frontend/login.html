<!DOCTYPE html>
<html lang="en">
<head>

<title>ChronoCampus - Login</title>

</head>

<body>

<div class="container">

<h2>ChronoCampus Login</h2>

Don't have an account?

</p>

</div>

<script src="script.js"></script>

</html>
