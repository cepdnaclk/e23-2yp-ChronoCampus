<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ChronoCampus — Loading</title>
  <link rel="stylesheet" href="css/base.css"/>
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .loader { text-align: center; }
    .loader-logo { font-family: var(--font-display); font-size: 2rem; margin-bottom: 1rem; }
    .loader-logo span { color: var(--gold); }
    .spinner { width: 32px; height: 32px; border: 3px solid rgba(255,255,255,0.1); border-top-color: var(--blue-400); border-radius: 50%; animation: spin 0.7s linear infinite; margin: 0 auto 1rem; }
    .loader-text { font-size: 0.875rem; color: var(--muted); }
  </style>
</head>
<body>
<div class="bg-layer"></div>
<div class="grid-overlay"></div>
<div class="loader">
  <div class="loader-logo">Chrono<span>Campus</span></div>
  <div class="spinner"></div>
  <div class="loader-text" id="loaderText">Setting up your session…</div>
</div>

<script src="js/auth.js"></script>
<script>
  (function () {
    const params      = new URLSearchParams(window.location.search);
    const urlUserId   = params.get("user_id");
    const urlRole     = params.get("role");
    const urlUserName = params.get("user_name") || "User";

    // Always write URL params into THIS tab's sessionStorage if present
    if (urlUserId && urlRole) {
      Auth.setSession(urlUserId, urlRole, urlUserName);
      const dest = urlRole === "admin" ? "admin.html" : "booking.html";
      document.getElementById("loaderText").textContent = `Welcome, ${urlUserName}!`;
      setTimeout(() => window.location.href = dest, 500);
      return;
    }

    // No URL params — check if this tab already has a session
    const existingRole = Auth.getRole();
    if (existingRole) {
      const dest = existingRole === "admin" ? "admin.html" : "booking.html";
      document.getElementById("loaderText").textContent = `Welcome back, ${Auth.getUserName()}!`;
      setTimeout(() => window.location.href = dest, 400);
      return;
    }

    // Nothing — go to login
    document.getElementById("loaderText").textContent = "No session found. Redirecting to login…";
    setTimeout(() => window.location.href = "login.html", 1500);
  })();
</script>
</body>
</html>
